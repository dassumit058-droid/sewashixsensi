<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEWASHI x SENSI | Premium Plans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(18, 18, 18, 0.85); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; backdrop-filter: blur(10px); }
        .plan-card { background: #0d0d0d; border: 1px solid #222; transition: 0.3s; position: relative; overflow: hidden; }
        .plan-card:hover { border-color: #ff3131; transform: translateY(-5px); }
        .premium-border { border: 1px solid #ff3131; box-shadow: 0 0 20px rgba(255, 49, 49, 0.1); }
        .glow-text { text-shadow: 0 0 10px rgba(255, 49, 49, 0.5); }
        #qrModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="p-4 md:p-10 flex flex-col items-center">

    <div class="text-center mb-10">
        <h1 class="text-4xl font-extrabold tracking-tighter glow-text uppercase">SEWASHI<span class="text-red-500">x</span>SENSI</h1>
        <p class="text-gray-400 text-sm mt-2">Select your plan to dominate the battlefield</p>
    </div>

    <div class="grid grid-cols-1 gap-6 w-full max-w-md">
        <div class="plan-card p-6 rounded-2xl flex justify-between items-center">
            <div>
                <h3 class="font-bold uppercase text-sm">Basic Plan</h3>
                <div class="text-2xl font-bold mt-1">₹99</div>
            </div>
            <button onclick="openQR('99')" class="bg-white/10 px-6 py-2 rounded-xl font-bold hover:bg-white/20 transition">Unlock</button>
        </div>

        <div class="plan-card premium-border p-6 rounded-2xl flex justify-between items-center relative">
            <div class="absolute top-0 right-0 bg-red-600 text-[8px] px-2 py-1 font-bold uppercase rounded-bl-lg">Popular</div>
            <div>
                <h3 class="font-bold uppercase text-red-500 text-sm">Premium Plan</h3>
                <div class="text-2xl font-bold mt-1">₹199</div>
            </div>
            <button onclick="openQR('199')" class="bg-red-600 px-6 py-2 rounded-xl font-bold hover:bg-red-700 transition">Unlock</button>
        </div>

        <div class="plan-card p-6 rounded-2xl flex justify-between items-center">
            <div>
                <h3 class="font-bold uppercase text-blue-500 text-sm">Esports Plan</h3>
                <div class="text-2xl font-bold mt-1">₹149</div>
            </div>
            <button onclick="openQR('149')" class="bg-blue-600 px-6 py-2 rounded-xl font-bold hover:bg-blue-700 transition">Unlock</button>
        </div>
    </div>

    <div id="qrModal">
        <div class="glass max-w-sm w-full p-8 text-center relative border-t-2 border-red-600">
            <button onclick="closeQR()" class="absolute top-4 right-4 text-gray-500 text-2xl hover:text-white">&times;</button>
            <h2 class="text-xl font-bold mb-4 uppercase">Scan to Pay</h2>
            
            <img src="qr.png.jpg" alt="UPI QR Code" class="w-full rounded-xl border-4 border-white mb-6">
            
            <p id="amountDisplay" class="text-red-500 font-bold text-lg mb-4"></p>
            <a href="https://wa.me/916291622842" class="block bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-green-700 transition">
                <i class="fab fa-whatsapp mr-2"></i> Send Screenshot
            </a>
        </div>
    </div>

    <script>
        function openQR(price) {
            document.getElementById('amountDisplay').innerText = "Amount to Pay: ₹" + price;
            document.getElementById('qrModal').style.display = 'flex';
        }
        function closeQR() {
            document.getElementById('qrModal').style.display = 'none';
        }
    </script>
</body>
</html>
